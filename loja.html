<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vault AI - Loja</title>
    <style>
        /* Seu estilo aqui, mantendo o design original */
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="boasVindas">Loja Vault AI</h1>
            <p id="statusUser"></p>
        </header>

        <!-- Produtos -->
        <div class="grid-loja">
            <div class="produto">
                <h3>Pacote Basic</h3>
                <span class="preco">500 Créditos</span>
                <button onclick="comprar('Basic')">Resgatar</button>
            </div>
            <div class="produto">
                <h3>Pacote Pro</h3>
                <span class="preco">2000 Créditos</span>
                <button onclick="comprar('Pro')">Resgatar</button>
            </div>
        </div>

        <!-- Painel de Admin (inicialmente oculto) -->
        <div id="adminPanel" style="display: none;">
            <h2 style="color: #d63031;">Painel do Administrador</h2>

            <h3 class="section">Registros de Acessos</h3>
            <table>
                <thead>
                    <tr><th>Nome</th><th>E-mail</th><th>Data/Hora</th></tr>
                </thead>
                <tbody id="listaAcessos"></tbody>
            </table>

            <h3 class="section">Planos Resgatados</h3>
            <table>
                <thead>
                    <tr><th>Nome</th><th>E-mail</th><th>Plano</th><th>Data/Hora</th></tr>
                </thead>
                <tbody id="listaCompras"></tbody>
            </table>
        </div>

        <!-- Sair do sistema -->
        <a href="index.html" class="sair" onclick="localStorage.clear()">Sair do sistema</a>
    </div>

    <script>
        const nome = localStorage.getItem('usuarioNome');
        const role = localStorage.getItem('role');

        if (!nome) {
            window.location.href = "index.html";  // Redireciona para o login se não houver usuário logado
        }

        // Exibe boas-vindas com o nome do usuário
        document.getElementById('boasVindas').innerText = `Olá, ${nome}!`;

        // Verifica se o usuário é um admin
        if (role === 'admin') {
            // Exibe o painel de administrador
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('statusUser').innerHTML = '<span class="badge-adm">ADMINISTRADOR</span>';
            carregarDadosAdmin();  // Carrega os dados do administrador
        }

        // Função para carregar os dados do administrador
        function carregarDadosAdmin() {
            const acessosBody = document.getElementById('listaAcessos');
            const comprasBody = document.getElementById('listaCompras');

            const acessos = JSON.parse(localStorage.getItem('bancoUsuarios')) || [];
            const compras = JSON.parse(localStorage.getItem('compras')) || [];

            // Preenche a tabela de acessos
            acessosBody.innerHTML = acessos.length === 0 
                ? '<tr><td colspan="3" style="text-align:center;">Nenhum acesso registrado ainda.</td></tr>'
                : acessos.map(u => `
                    <tr>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>${u.data}</td>
                    </tr>
                `).join('');

            // Preenche a tabela de compras
            comprasBody.innerHTML = compras.length === 0 
                ? '<tr><td colspan="4" style="text-align:center;">Nenhum plano resgatado ainda.</td></tr>'
                : compras.map(c => `
                    <tr>
                        <td>${c.nome}</td>
                        <td>${c.email}</td>
                        <td><strong>${c.produto}</strong></td>
                        <td>${c.data}</td>
                    </tr>
                `).join('');
        }

        // Função para resgatar um pacote
        function comprar(item) {
            const nomeAtual = localStorage.getItem('usuarioNome') || 'Usuário';
            const emailAtual = localStorage.getItem('usuarioEmail') || 'sem@email';

            let compras = JSON.parse(localStorage.getItem('compras')) || [];
            compras.push({
                nome: nomeAtual,
                email: emailAtual,
                produto: item,
                data: new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
            });
            localStorage.setItem('compras', JSON.stringify(compras));

            alert(`Pacote ${item} resgatado com sucesso!`);

            if (role === 'admin') carregarDadosAdmin(); // Atualiza os dados no painel se for admin
        }
    </script>
</body>
</html>
