<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault AI - Loja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f8f9fa; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 2rem; }
        .badge-adm { background: #d63031; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .produto { border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; text-align: center; }
        button { background: #0984e3; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        /* Painel Admin */
        .admin-panel { display: none; margin-top: 3rem; border-top: 2px solid #eee; padding-top: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f4f4f4; }
        .sair { display: block; text-align: center; margin-top: 2rem; color: #e74c3c; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="boasVindas">Olá!</h1>
            <div id="statusUser"></div>
        </div>

        <div class="grid">
            <div class="produto">
                <h3>Pacote Basic</h3>
                <p>500 Créditos</p>
                <button onclick="comprar('Basic')">Resgatar</button>
            </div>
            <div class="produto">
                <h3>Pacote Pro</h3>
                <p>2000 Créditos</p>
                <button onclick="comprar('Pro')">Resgatar</button>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <h2 style="color: #d63031;">Relatório do Administrador</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Ação/Plano</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="listaAtividade"></tbody>
            </table>
        </div>

        <a href="index.html" class="sair" onclick="localStorage.clear()">Sair do sistema</a>
    </div>

    <script>
        const nome = localStorage.getItem('usuarioNome');
        const role = localStorage.getItem('role');
        const email = localStorage.getItem('usuarioEmail');

        if (!nome) { window.location.href = "index.html"; }

        document.getElementById('boasVindas').innerText = `Olá, ${nome}!`;

        if (role === 'admin') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('statusUser').innerHTML = '<span class="badge-adm">ADMINISTRADOR</span>';
            atualizarPainel();
        }

        function comprar(plano) {
            let compras = JSON.parse(localStorage.getItem('compras')) || [];
            compras.push({
                nome: nome,
                email: email,
                plano: plano,
                data: new Date().toLocaleString('pt-BR')
            });
            localStorage.setItem('compras', JSON.stringify(compras));
            alert(`Sucesso! Você resgatou o ${plano}.`);
            if (role === 'admin') atualizarPainel();
        }

        function atualizarPainel() {
            const lista = document.getElementById('listaAtividade');
            const compras = JSON.parse(localStorage.getItem('compras')) || [];
            
            lista.innerHTML = compras.map(c => `
                <tr>
                    <td>${c.nome}</td>
                    <td>${c.email}</td>
                    <td><strong>${c.plano}</strong></td>
                    <td>${c.data}</td>
                </tr>
            `).reverse().join(''); // Mostra os mais recentes primeiro
        }
    </script>
</body>
</html>
