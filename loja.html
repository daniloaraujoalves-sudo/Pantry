<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vault AI - Loja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 700px; width: 100%; }
        .grid-loja { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .produto { border: 1px solid #dfe6e9; padding: 1.5rem; border-radius: 12px; text-align: center; }
        .preco { color: #0984e3; font-weight: bold; font-size: 1.2rem; margin: 0.8rem 0; display: block; }
        #adminPanel { display: none; margin-top: 2.5rem; padding-top: 2rem; border-top: 2px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #ddd; padding: 0.8rem; text-align: left; font-size: 0.9rem; }
        th { background: #f1f1f1; font-weight: 600; }
        .badge-adm { background: #d63031; color: white; padding: 0.3rem 0.7rem; border-radius: 4px; font-size: 0.75rem; }
        button { width: 100%; padding: 0.7rem; background: #0984e3; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #074b83; }
        .sair { margin-top: 2.5rem; background: #e74c3c; display: block; text-align: center; padding: 1rem; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .sair:hover { background: #c0392b; }
        h3.section { margin: 2rem 0 0.8rem; color: #2d3436; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="boasVindas">Loja Vault AI</h1>
            <p id="statusUser"></p>
        </header>

        <div class="grid-loja">
            <div class="produto">
                <h3>Pacote Basic</h3>
                <span class="preco">500 Créditos</span>
                <button onclick="comprar('Basic')">Resgatar</button>
            </div>
            <div class="produto">
                <h3>Pacote Pro</h3>
                <span class="preco">2000 Créditos</span>
                <button onclick="comprar('Pro')">Resgatar</button>
            </div>
        </div>

        <div id="adminPanel">
            <h2 style="color: #d63031;">Painel do Administrador</h2>

            <h3 class="section">Registros de Acessos</h3>
            <table>
                <thead>
                    <tr><th>Nome</th><th>E-mail</th><th>Data/Hora</th></tr>
                </thead>
                <tbody id="listaAcessos"></tbody>
            </table>

            <h3 class="section">Planos Resgatados</h3>
            <table>
                <thead>
                    <tr><th>Nome</th><th>E-mail</th><th>Plano</th><th>Data/Hora</th></tr>
                </thead>
                <tbody id="listaCompras"></tbody>
            </table>
        </div>

        <a href="index.html" class="sair" onclick="localStorage.clear()">Sair do sistema</a>
    </div>

    <script>
        const nome = localStorage.getItem('usuarioNome');
        const role = localStorage.getItem('role');

        if (!nome) {
            window.location.href = "index.html";
            return;
        }

        document.getElementById('boasVindas').innerText = `Olá, ${nome}!`;

        if (role === 'admin') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('statusUser').innerHTML = '<span class="badge-adm">ADMINISTRADOR</span>';
            carregarDadosAdmin();
        }

        function carregarDadosAdmin() {
            const acessosBody = document.getElementById('listaAcessos');
            const comprasBody = document.getElementById('listaCompras');

            const acessos = JSON.parse(localStorage.getItem('bancoUsuarios')) || [];
            const compras = JSON.parse(localStorage.getItem('compras')) || [];

            acessosBody.innerHTML = acessos.length === 0 
                ? '<tr><td colspan="3" style="text-align:center;">Nenhum acesso registrado ainda.</td></tr>'
                : acessos.map(u => `
                    <tr>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>${u.data}</td>
                    </tr>
                `).join('');

            comprasBody.innerHTML = compras.length === 0 
                ? '<tr><td colspan="4" style="text-align:center;">Nenhum plano resgatado ainda.</td></tr>'
                : compras.map(c => `
                    <tr>
                        <td>${c.nome}</td>
                        <td>${c.email}</td>
                        <td><strong>${c.produto}</strong></td>
                        <td>${c.data}</td>
                    </tr>
                `).join('');
        }

        function comprar(item) {
            const nomeAtual = localStorage.getItem('usuarioNome') || 'Usuário';
            const emailAtual = localStorage.getItem('usuarioEmail') || 'sem@email';

            let compras = JSON.parse(localStorage.getItem('compras')) || [];
            compras.push({
                nome: nomeAtual,
                email: emailAtual,
                produto: item,
                data: new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
            });
            localStorage.setItem('compras', JSON.stringify(compras));

            alert(`Pacote ${item} resgatado com sucesso!`);

            if (role === 'admin') carregarDadosAdmin(); // atualiza em tempo real se for admin
        }
    </script>
</body>
</html>
