<h1 id="boasVindas"></h1>
<div id="statusUser"></div>

<div class="grid">
    <button onclick="comprar('Pacote Basic')">Comprar Basic (500)</button>
    <button onclick="comprar('Pacote Pro')">Comprar Pro (2000)</button>
</div>

<hr>

<div id="adminPanel" style="display:none; border: 2px solid red; padding: 10px;">
    <h2>🛠 Painel do Administrador</h2>
    <button onclick="limparDados()">Limpar Histórico</button>
    <table border="1">
        <thead>
            <tr><th>Usuário</th><th>E-mail</th><th>Data</th></tr>
        </thead>
        <tbody id="tabelaLogs"></tbody>
    </table>
</div>

<script>
    const nome = localStorage.getItem('usuarioNome');
    const email = localStorage.getItem('usuarioEmail');
    const role = localStorage.getItem('role');

    if (!nome) window.location.href = "index.html";
    document.getElementById('boasVindas').innerText = `Olá, ${nome}!`;

    // --- FUNÇÃO: INTERFACE DO ADM ---
    if (role === 'admin') {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('statusUser').innerHTML = "<b>MODO: ADMINISTRADOR</b>";
        carregarLogs();
    }

    // --- FUNÇÃO: COMPRA ---
    function comprar(plano) {
        alert(`Sucesso! ${nome}, você resgatou o ${plano}.`);
        // Aqui você pode adicionar lógica para salvar a compra no localStorage também
    }

    // --- FUNÇÃO: ADM (Lógica de dados) ---
    function carregarLogs() {
        const logs = JSON.parse(localStorage.getItem('bancoUsuarios')) || [];
        const tabela = document.getElementById('tabelaLogs');
        tabela.innerHTML = logs.map(l => `
            <tr><td>${l.nome}</td><td>${l.email}</td><td>${l.data}</td></tr>
        `).join('');
    }

    function limparDados() {
        if(confirm("Apagar logs?")) {
            localStorage.removeItem('bancoUsuarios');
            location.reload();
        }
    }
</script>
