<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault AI - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Vault AI</h1>
            <p>Cadastro de Clientes</p>
        </header>

        <form id="dataForm">
            <div class="input-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" placeholder="Digite o nome do cliente" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="cliente@empresa.com" required>
            </div>

            <button type="submit" class="btn-save">Arquivar Cliente</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
