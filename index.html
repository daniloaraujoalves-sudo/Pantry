<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vault AI - Loja de Créditos</title>
    <link rel="stylesheet" href="style.css"> <style>
        .grid-loja {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .produto {
            border: 1px solid #dfe6e9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .preco {
            color: #0984e3;
            font-weight: bold;
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <header>
            <h1>Loja Vault AI</h1>
            <p>Use seus créditos de administrador</p>
        </header>

        <div class="grid-loja">
            <div class="produto">
                <h3>Pacote Basic</h3>
                <span class="preco">500 Créditos</span>
                <button class="btn-save" style="font-size: 0.8rem;">Resgatar</button>
            </div>
            <div class="produto">
                <h3>Pacote Pro</h3>
                <span class="preco">2000 Créditos</span>
                <button class="btn-save" style="font-size: 0.8rem;">Resgatar</button>
            </div>
        </div>
        
        <br>
        <a href="index.html" style="color: #636e72; font-size: 0.8rem; text-decoration: none;">← Voltar ao Cadastro</a>
    </div>
</body>
</html>
