<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault AI - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #ffffff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); width: 100%; max-width: 380px; }
        header { text-align: center; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; font-weight: 500; }
        .input-group input { width: 100%; padding: 0.75rem; border: 1px solid #dfe6e9; border-radius: 8px; outline: none; width: 100%; }
        .btn-save { width: 100%; padding: 0.9rem; background-color: #0984e3; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vault AI</h1>
            <p>Identifique-se para continuar</p>
        </header>

        <form id="dataForm">
            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="name" required>
            </div>
            <div class="input-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit" id="btnSubmit" class="btn-save">Acessar Sistema</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('dataForm');
        const ADM_EMAIL = "danilo.araujo.alves@escola.pr.gov";

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();

            // Salva os dados na sessão
            localStorage.setItem('usuarioNome', nome);
            localStorage.setItem('usuarioEmail', email);

            // Define se é ADM
            if (email === ADM_EMAIL) {
                localStorage.setItem('role', 'admin');
                alert("Bem-vindo, Administrador Danilo!");
            } else {
                localStorage.setItem('role', 'user');
                alert(`Olá, ${nome}! Acessando loja...`);
            }

            window.location.href = "loja.html";
        });
    </script>
</body>
</html>
